<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Visor de Vacantes GORE Ñuble</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con totales, índice de áreas a la izquierda y fichas de vacantes agrupadas por área a la derecha. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#111a26; --muted:#566275; --line:#d6dce5; --accent:#136cae; --accent-soft:#e3eff8;
  --ok:#167a3a; --ok-bg:#e2f4e8; --ok-line:#8fcfa6; --warn:#8a5200; --warn-bg:#fdefd8;
  --b-azul:#136cae; --b-morado:#842d84; --b-rojo:#ca2c3b; --b-verde:#1f9b4a; --b-naranja:#f1931b;
  --display:"Archivo","Segoe UI",Arial,sans-serif; --body:"Public Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141c; --surface:#172029; --ink:#e9eef4; --muted:#9ba8b8; --line:#2b3745; --accent:#6db3e6; --accent-soft:#17303f;
  --ok:#62cf8a; --ok-bg:#12331f; --ok-line:#2a6b41; --warn:#f3c06a; --warn-bg:#3a2b10; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#172029; --ink:#e9eef4; --muted:#9ba8b8; --line:#2b3745; --accent:#6db3e6; --accent-soft:#17303f;
  --ok:#62cf8a; --ok-bg:#12331f; --ok-line:#2a6b41; --warn:#f3c06a; --warn-bg:#3a2b10; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--b-azul) 0 20%,var(--b-morado) 20% 40%,var(--b-rojo) 40% 60%,var(--b-verde) 60% 80%,var(--b-naranja) 80% 100%)}
header .logo{background:#ffffff;border-radius:6px;padding:4px 8px;flex:0 0 auto;line-height:0}
header .logo img{height:78px;width:auto;max-width:100%}
header .ttl{flex:1 1 320px;min-width:0}
header h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.ok{background:var(--ok-bg);border-color:var(--ok-line)} .kpi.ok .v,.kpi.ok .l{color:var(--ok)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar input[type=search],.bar select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.bar input[type=search]{flex:1 1 220px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;border:0;background:transparent;color:var(--ink);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--b-azul);color:#ffffff;font-weight:600}
.main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
nav.areas{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:2px}
nav.areas h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:8px 8px 4px;font-weight:600}
nav.areas button{font:inherit;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px;border-radius:4px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
nav.areas button:hover{background:var(--accent-soft)}
nav.areas button[aria-pressed=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
nav.areas .nm{font-weight:600} nav.areas .ct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.meter{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--b-verde)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:22px;min-width:0}
section.area>h2 .dot{width:12px;height:12px;border-radius:3px;align-self:center;flex:0 0 auto}
.g-CVC{--g:var(--b-naranja)} .g-HSA{--g:var(--b-morado)} .g-CIES{--g:var(--b-rojo)} .g-CTA{--g:var(--b-azul)}
section.area>h2{font-family:var(--display);font-size:18px;margin:0 0 2px;padding-bottom:6px;border-bottom:2px solid var(--g,var(--line));display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
section.area>h2 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px 20px}
@media (max-width:700px){.row{grid-template-columns:minmax(0,1fr)}}
.row.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.row .top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.id{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 6px;background:var(--bg)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px}
.pill.ok{background:var(--b-verde);color:#ffffff} .pill.vac{background:var(--warn-bg);color:var(--warn)} .pill.part{border:1px solid var(--ok);color:var(--ok)}
.row h3{font-size:15px;font-weight:600;margin:6px 0 2px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:12.5px}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.obs{margin:6px 0 0;font-size:12.5px;color:var(--muted);max-width:65ch}
.form{display:grid;gap:8px;align-content:start}
.form label{display:grid;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.form input,.form select{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
.row.ok .form input.nm{border-color:var(--ok-line);font-weight:600;color:var(--ok)}
.form input:disabled,.form select:disabled{opacity:1;background:transparent;border-color:transparent;padding-left:0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:20px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line);background:var(--surface)}
.sw.ok{background:var(--ok-bg);border-color:var(--b-verde)}
#status{font-size:12.5px;color:var(--muted);min-height:1.4em}
</style>
</head>

    <div class="ttl">
    <h1>Visor de Vacantes</h1>
    <p>Cargos por proveer ordenados por grupo (CVC, honorarios a suma alzada, CIES y contratas), con área, nombre asignado y forma de ingreso. Corte al 7 de octubre de 2026.</p>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar cargo, nombre o ID" aria-label="Buscar">
    <div class="seg" id="estado" role="group" aria-label="Estado">
      <button type="button" data-v="todos" aria-pressed="true">Todos</button>
      <button type="button" data-v="asig" aria-pressed="false">Con nombre</button>
      <button type="button" data-v="vac" aria-pressed="false">Sin nombre</button>
    </div>
    <select id="grupo" aria-label="Grupo"><option value="">Todos los grupos</option></select>
    <select id="formaF" aria-label="Forma de ingreso"><option value="">Todas las formas de ingreso</option></select>
  </div>
  <div class="legend">
    <span><i class="sw ok"></i>Con nombre asignado</span>
    <span><i class="sw"></i>Sin nombre asignado</span>
    <span id="status"></span>
  </div>
  <div class="main">
    <nav class="areas" id="areas" aria-label="Áreas"></nav>
    <div class="list" id="list"><div class="note">Cargando vacantes…</div></div>
  </div>
</div>
<script>
const FORMAS=["Por definir","Proceso de selección","Concurso público","Contratación directa","Reemplazo o suplencia","Traslado interno"];
const S={docs:[],area:"",estado:"todos",grupo:"",forma:"",q:"",canWrite:true,loaded:false,pending:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const peso=n=>n==null?"No informado":"$"+Math.round(n).toLocaleString("es-CL");
const fecha=s=>{if(!s)return"";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const nombres=d=>String(d.nombre||"").split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
const asignados=d=>Math.min(d.n||1,nombres(d).length);
function plazo(d){ if(d.inicio&&d.termino) return fecha(d.inicio)+" al "+fecha(d.termino)+(d.meses?" ("+d.meses+" meses)":""); if(d.inicio) return "Desde el "+fecha(d.inicio)+", sin término definido"; return "Sin plazo informado"; }
function visibles(skipArea){
  const q=S.q.trim().toLowerCase();
  return S.docs.filter(d=>{
    if(!skipArea&&S.area&&d.area!==S.area) return false;
    if(S.grupo&&d.grupo!==S.grupo) return false;
    if(S.forma&&(d.forma||"Por definir")!==S.forma) return false;
    const a=asignados(d);
    if(S.estado==="asig"&&a===0) return false;
    if(S.estado==="vac"&&a>=(d.n||1)) return false;
    if(q&&![d.id,d.cargo,d.nombre,d.area,d.grupo,d.modalidad,d.ref].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderKpis(){
  const tot=S.docs.reduce((s,d)=>s+(d.n||1),0), asg=S.docs.reduce((s,d)=>s+asignados(d),0);
  const costo=S.docs.reduce((s,d)=>s+(d.total||0),0), sinMonto=S.docs.filter(d=>d.total==null).reduce((s,d)=>s+(d.n||1),0);
  $("kpis").innerHTML=`
   <div class="kpi"><div class="l">Cargos por proveer</div><div class="v">${tot}</div><div class="s">${S.docs.length} registros en ${new Set(S.docs.map(d=>d.area)).size} áreas</div></div>
   <div class="kpi ok"><div class="l">Con nombre asignado</div><div class="v">${asg}</div><div class="s">${tot?Math.round(asg/tot*100):0}% del total</div></div>
   <div class="kpi"><div class="l">Sin nombre asignado</div><div class="v">${tot-asg}</div><div class="s">Pendientes de selección o designación</div></div>
   <div class="kpi"><div class="l">Costo del período</div><div class="v" style="font-size:21px;line-height:1.5">${peso(costo)}</div><div class="s">${sinMonto?sinMonto+" contratas sin monto informado":"Todos los cargos valorizados"}</div></div>`;
}
function renderAreas(){
  const base=visibles(true), m=new Map();
  S.docs.forEach(d=>{ if(!m.has(d.area)) m.set(d.area,{n:0,a:0}); });
  base.forEach(d=>{const x=m.get(d.area); x.n+=d.n||1; x.a+=asignados(d);});
  const tn=base.reduce((s,d)=>s+(d.n||1),0), ta=base.reduce((s,d)=>s+asignados(d),0);
  const item=(k,label,x)=>`<button type="button" data-area="${esc(k)}" aria-pressed="${S.area===k}"><span class="nm">${esc(label)}</span><span class="ct">${x.a} de ${x.n}</span><span class="meter"><i style="width:${x.n?x.a/x.n*100:0}%"></i></span></button>`;
  const arr=[...m.entries()].sort((p,q)=>(p[0]==="Sin área definida")-(q[0]==="Sin área definida")||q[1].n-p[1].n||p[0].localeCompare(q[0],"es"));
  $("areas").innerHTML=`<h2>Áreas · asignados de cargos</h2>`+item("","Todas las áreas",{n:tn,a:ta})+arr.map(([k,x])=>item(k,k,x)).join("");
}
function rowHtml(d){
  const n=d.n||1,a=asignados(d),full=a>=n,dis=S.canWrite?"":"disabled";
  const pill=full?`<span class="pill ok">${n>1?n+" asignados":"Asignado"}</span>`:a>0?`<span class="pill part">${a} de ${n} asignados</span>`:`<span class="pill vac">${n>1?n+" cargos sin nombre":"Sin nombre"}</span>`;
  const opts=[...new Set([...FORMAS,d.forma||"Por definir"])].map(f=>`<option ${f===(d.forma||"Por definir")?"selected":""}>${esc(f)}</option>`).join("");
  return `<article class="row ${full?"ok":""}" data-id="${esc(d.id)}">
   <div>
    <div class="top"><span class="id">${esc(d.id)}</span>${pill}<span class="id" style="color:var(--accent);border-color:var(--accent)">${esc(d.area)}</span></div>
    <h3>${esc(d.cargo)}</h3>
    <div class="meta">
      <span>Modalidad <b>${esc(d.modalidad)}</b></span><span>Cargos <b>${n}</b></span>
      <span>Monto mensual <b>${peso(d.monto)}</b></span>${d.total!=null?`<span>Total <b>${peso(d.total)}</b></span>`:""}
      <span>Grado <b>${esc(d.grado)}</b></span><span>Plazo <b>${esc(plazo(d))}</b></span>
      ${d.unidad&&d.unidad!==d.area?`<span>Unidad <b>${esc(d.unidad)}</b></span>`:""}<span>Ref. <b>${esc(d.ref)}</b></span>
    </div>
    ${d.obs?`<p class="obs">${esc(d.obs)}</p>`:""}
   </div>
   <div class="form">
    <label>${n>1?"Nombres asignados (separados por coma)":"Nombre asignado"}<input class="nm" id="f-${esc(d.id)}-nombre" data-f="nombre" value="${esc(d.nombre)}" placeholder="${S.canWrite?"Sin asignar":"—"}" ${dis}></label>
    <label>Forma de ingreso<select id="f-${esc(d.id)}-forma" data-f="forma" ${dis}>${opts}</select></label>
   </div></article>`;
}
function renderList(){
  if(!S.loaded) return;
  if(!S.docs.length){ $("list").innerHTML=`<div class="note">Aún no hay vacantes cargadas. Aparecerán aquí, agrupadas por área, cuando se registren.</div>`; return; }
  const v=visibles(false);
  if(!v.length){ $("list").innerHTML=`<div class="note">Ninguna vacante coincide con los filtros. Cambie el área, el estado o la búsqueda.</div>`; return; }
  const ORD=["CVC","HSA","CIES","CTA"], pre=d=>{const i=ORD.indexOf(String(d.id).split("-")[0]); return i<0?ORD.length:i;};
  const g=new Map(); v.slice().sort((x,y)=>pre(x)-pre(y)||(x.orden??0)-(y.orden??0)).forEach(d=>{ if(!g.has(d.grupo)) g.set(d.grupo,[]); g.get(d.grupo).push(d); });
  $("list").innerHTML=[...g.entries()].map(([k,ds])=>{
    const n=ds.reduce((s,d)=>s+(d.n||1),0),a=ds.reduce((s,d)=>s+asignados(d),0),c=ds.reduce((s,d)=>s+(d.total||0),0);
    return `<section class="area g-${esc(String(ds[0].id).split("-")[0])}"><h2><i class="dot" style="background:var(--g)"></i>${esc(k)} <small>${n} ${n===1?"cargo":"cargos"} · ${a} con nombre · ${c?peso(c):"sin monto informado"}</small></h2><div class="rows">${ds.map(rowHtml).join("")}</div></section>`;
  }).join("");
}
function renderAll(){
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest(".form")){ S.pending=true; renderKpis(); renderAreas(); return; }
  S.pending=false; renderKpis(); renderAreas(); renderList();
}
function fillFilters(){
  const gs=[...new Set(S.docs.map(d=>d.grupo))]; const g=$("grupo"),cur=g.value;
  g.innerHTML=`<option value="">Todos los grupos</option>`+gs.map(x=>`<option>${esc(x)}</option>`).join(""); g.value=gs.includes(cur)?cur:""; S.grupo=g.value;
  const f=$("formaF"),cf=f.value; f.innerHTML=`<option value="">Todas las formas de ingreso</option>`+FORMAS.map(x=>`<option>${esc(x)}</option>`).join(""); f.value=cf;
}
async function save(el){
  const row=el.closest(".row"); if(!row) return;
  const id=row.dataset.id,f=el.dataset.f,val=el.value.trim(),d=S.docs.find(x=>x.id===id);
  if(!d||String(d[f]??"")===val) return;
  d[f]=val; local[id]={...(local[id]||{}),[f]:val};
  try{ localStorage.setItem(LS,JSON.stringify(local)); $("status").textContent="Cambio guardado en este navegador."; }
  catch(_){ $("status").textContent="El cambio no se pudo guardar en este navegador."; }
}

$("estado").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; S.estado=b.dataset.v; [...$("estado").children].forEach(x=>x.setAttribute("aria-pressed",x===b)); renderAll(); });

$("formaF").addEventListener("change",e=>{ S.forma=e.target.value; renderAll(); });
